name: CI

# Two groups of jobs:
#   1. image: builds docker/Dockerfile and pushes it to
#      ghcr.io/<owner>/cocotb-gpi-fix-vhdl-identifier-case, tagged with the git tree hash of docker/. An image that already exists for that hash is reused.
#   2. tests: run in that image. One job per simulator runs the case tests with the fix (they
#      must pass) and with stock cocotb (failures expected; they show what the fix changes).
#      The whole cocotb regression runs in parallel, one job per tree and simulator.
#
# ccache (the cocotb build and the Verilator models) and the pip cache are kept between runs
# with actions/cache, per image and job. ccache hashes the compiler by its version output
# (CCACHE_COMPILERCHECK='%compiler% -v', set in verify/env.sh), not by the binary's timestamp.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Each job gets only what it needs: the image job writes the package, the test jobs read it.
permissions:
  contents: read

# bash with -e and pipefail; a container job would otherwise use sh (dash).
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: tag
        run: |
          name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cocotb-gpi-fix-vhdl-identifier-case
          tree=$(git rev-parse HEAD:docker)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "ref=$name:docker-${tree:0:12}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: exists
        run: |
          if docker manifest inspect "${{ steps.tag.outputs.ref }}" > /dev/null 2>&1; then
            echo "image=yes" >> "$GITHUB_OUTPUT"
            echo "Reusing ${{ steps.tag.outputs.ref }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "image=no" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.exists.outputs.image == 'no'
        uses: docker/setup-buildx-action@v4

      - if: steps.exists.outputs.image == 'no'
        uses: docker/build-push-action@v7
        with:
          context: docker
          push: true
          tags: |
            ${{ steps.tag.outputs.ref }}
            ${{ steps.tag.outputs.name }}:latest

      - name: Check the tool versions
        run: docker run --rm "${{ steps.tag.outputs.ref }}" versions

  case-tests:
    name: Case tests (${{ matrix.sim }})
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sim: [nvc, ghdl, icarus, verilator]
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out the submodules
        id: submodules
        run: |
          # The container runs as root on a workspace owned by the runner user.
          git config --global --add safe.directory '*'
          git submodule update --init --recursive
          git submodule status

      - name: Restore ccache and pip cache
        uses: actions/cache@v6
        with:
          path: |
            work/ccache
            work/pip-cache
          key: cache-${{ needs.image.outputs.ref }}-${{ matrix.sim }}-${{ github.sha }}
          restore-keys: |
            cache-${{ needs.image.outputs.ref }}-${{ matrix.sim }}-
            cache-${{ needs.image.outputs.ref }}-

      - name: Build cocotb with the fix
        id: build-fix
        run: verify/build.sh fix

      - name: Build stock cocotb
        id: build-upstream
        if: ${{ !cancelled() && steps.submodules.outcome == 'success' }}
        run: verify/build.sh upstream

      - name: Case tests with the fix (must pass)
        if: ${{ !cancelled() && steps.build-fix.outcome == 'success' }}
        run: |
          { echo '### With the fix'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          rc=0
          verify/test.sh fix ${{ matrix.sim }} | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Case tests with stock cocotb (failures expected)
        if: ${{ !cancelled() && steps.build-upstream.outcome == 'success' }}
        run: |
          { echo '### With stock cocotb (failures expected)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          verify/test.sh upstream ${{ matrix.sim }} | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: ccache statistics
        if: always()
        run: |
          { echo '### ccache'; echo '```'; CCACHE_DIR=work/ccache ccache -s; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: case-tests-${{ matrix.sim }}
          path: |
            work/results/*/*/*/results.xml
            work/results/*/*/*/log
            work/logs/
          if-no-files-found: ignore

  regression:
    name: Regression (${{ matrix.tree }}, ${{ matrix.sim }})
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # cocotb's test_ci.py checks, under GitHub Actions, that Python is the version its CI
      # matrix sets here. The image has Python 3.12.
      PYTHON_VERSION: "3.12"
    strategy:
      fail-fast: false
      matrix:
        tree: [fix, upstream]
        sim: [nvc, ghdl, icarus, verilator]
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out the submodules
        id: submodules
        run: |
          # The container runs as root on a workspace owned by the runner user.
          git config --global --add safe.directory '*'
          git submodule update --init --recursive
          git submodule status

      - name: Restore ccache and pip cache
        uses: actions/cache@v6
        with:
          path: |
            work/ccache
            work/pip-cache
          key: cache-${{ needs.image.outputs.ref }}-${{ matrix.tree }}-${{ matrix.sim }}-${{ github.sha }}
          restore-keys: |
            cache-${{ needs.image.outputs.ref }}-${{ matrix.tree }}-${{ matrix.sim }}-
            cache-${{ needs.image.outputs.ref }}-

      - name: Build cocotb (${{ matrix.tree }})
        run: verify/build.sh ${{ matrix.tree }}

      - name: Regression
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          rc=0
          verify/regression.sh ${{ matrix.tree }} ${{ matrix.sim }} | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: ccache statistics
        if: always()
        run: |
          { echo '### ccache'; echo '```'; CCACHE_DIR=work/ccache ccache -s; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-${{ matrix.tree }}-${{ matrix.sim }}
          path: |
            work/regression/
            work/logs/
          if-no-files-found: ignore
